<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris · Bambú Tech Services</title>
  <link rel="stylesheet" href="style.css" />
  <script>
    // Tema antes del primer pintado: evita el fundido de oscuro a claro al cargar.
    try {
      if (localStorage.getItem('tetris-theme') === 'light') {
        document.documentElement.classList.add('light-mode');
      }
    } catch (e) {}
  </script>
</head>
<body>
  <div class="wrapper">
    <header class="masthead">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">Bambú Tech Services</span>
      </div>
      <button id="theme-toggle" class="theme-toggle">Modo claro</button>
    </header>

    <h1 class="game-title">Tetris</h1>

    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="card metrics">
          <div class="metric">
            <span class="label">Puntos</span>
            <span class="value" id="score">0</span>
          </div>
          <div class="metric">
            <span class="label">Líneas</span>
            <span class="value" id="lines">0</span>
          </div>
          <div class="metric">
            <span class="label">Nivel</span>
            <span class="value" id="level">1</span>
          </div>
        </div>

        <div class="card next">
          <span class="label">Siguiente</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="card controls">
          <span class="label">Controles</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> <span>Mover</span></li>
            <li><kbd>↑</kbd> <span>Rotar</span></li>
            <li><kbd>↓</kbd> <span>Bajar</span></li>
            <li><kbd>Espacio</kbd> <span>Caída</span></li>
            <li><kbd>P</kbd> <span>Pausa</span></li>
          </ul>
        </div>

        <div class="card records" id="records-card">
          <span class="label">Records</span>
          <div id="records-list" class="records-compact"></div>
          <div class="records-stats">
            <div class="records-stat">
              <span class="label">Mejor combo</span>
              <span class="records-stat-value" id="best-combo">0</span>
            </div>
            <div class="records-stat">
              <span class="label">Líneas máx.</span>
              <span class="records-stat-value" id="max-lines">0</span>
            </div>
          </div>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="particles" aria-hidden="true"></div>
      <div class="overlay-box">
        <p id="overlay-title">Game over</p>
        <p id="overlay-score"></p>

        <div id="save-row" class="save-row hidden">
          <label class="save-note" id="save-note" for="player-name">¡Entraste al top 5! Escribe tu nombre</label>
          <div class="save-controls">
            <input id="player-name" type="text" maxlength="12" placeholder="Tu nombre"
                   autocomplete="off" spellcheck="false" />
            <button id="save-score-btn" class="btn-primary">Guardar</button>
          </div>
        </div>

        <div id="overlay-records" class="records-table"></div>

        <button id="restart-btn">Jugar de nuevo</button>
      </div>
    </div>

    <div id="start-overlay" class="overlay">
      <div class="particles" aria-hidden="true"></div>
      <div class="overlay-box">
        <p class="start-title">Tetris</p>
        <p class="start-sub">Mejores puntuaciones</p>
        <div id="start-records" class="records-table"></div>
        <button id="play-btn" class="btn-primary">Jugar</button>
        <button id="clear-records-btn" class="ghost-btn">Borrar records</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
